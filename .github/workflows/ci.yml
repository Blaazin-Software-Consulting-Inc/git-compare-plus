# CI: unit + real-git integration tests, type check, packaging with the size budget, and the
# VS Code extension-host smoke test, on all three platforms the extension supports.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  # The release workflow runs these same checks on the tagged commit before publishing.
  workflow_call:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      # The integration tests create commits in temporary repos; runners have no git identity.
      - run: git config --global user.name ci && git config --global user.email ci@example.com
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run package
      - run: npm run budget
      # The packaged (minified) bundle is what the smoke test loads.
      - name: Extension-host smoke test (Linux, virtual display)
        if: runner.os == 'Linux'
        run: xvfb-run -a npm run test:host
      - name: Extension-host smoke test
        if: runner.os != 'Linux'
        run: npm run test:host

  # Speed regressions: the benchmark on git/git (bench/bench.ts), failing if any median is over its
  # limit. Linux only: one realistic machine is enough to catch a slowdown, and the clone is cached.
  bench:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - uses: actions/cache@v4
        with:
          path: .bench/git
          key: bench-git-v2.47.0
      - run: git config --global user.name ci && git config --global user.email ci@example.com
      - run: npm ci
      - run: npm run bench -- --check --json bench-results.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: bench-results
          path: bench-results.json
