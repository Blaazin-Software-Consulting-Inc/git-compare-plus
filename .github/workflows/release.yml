# Release: pushing a tag `v<version>` (e.g. v1.0.0) publishes that commit to the Visual Studio
# Marketplace and Open VSX and creates a GitHub Release with the .vsix and the CHANGELOG entry.
#
# Order: the full CI (all three platforms, host test, benchmark) must pass on the tagged commit;
# then scripts/release-notes.mjs checks the tag, package.json and CHANGELOG agree; only then does
# anything get published. The publish job runs in the `release` environment, which holds the
# Open VSX token (OVSX_PAT) and can require an approval. The Visual Studio Marketplace needs no
# stored token: the publisher's Trusted Publishing policy accepts this workflow's GitHub OIDC
# token (repository, `release.yml` and the `release` environment must all match the policy).
# CONTRIBUTING.md#releasing has the one-time setup and the checklist.
#
# It can also be started by hand ON THE TAG (`gh workflow run release.yml --ref v1.0.0`, or the
# Actions tab with the tag picked), for when GitHub does not start it for the tag push. Started
# on a branch instead, the release check fails before anything is published: the ref name is
# not `v<version>`.
#
# Re-running after a partial failure is safe: both stores skip a version they already have, and
# the GitHub Release is created only if it does not exist yet.
name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

# Never two releases at once, and never cancel one half-published.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  publish:
    needs: ci
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: write # create the GitHub Release
      id-token: write # the OIDC token vsce exchanges for a short-lived Marketplace credential
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Check the tag, package.json and CHANGELOG agree
        run: node scripts/release-notes.mjs "$GITHUB_REF_NAME" --out release-notes.md
      - run: npm run package
      - run: npm run budget
      - name: Publish to the Visual Studio Marketplace
        run: ./node_modules/.bin/vsce publish --oidc --packagePath git-compare-plus.vsix --skip-duplicate
      - name: Publish to Open VSX
        run: ./node_modules/.bin/ovsx publish --packagePath git-compare-plus.vsix --skip-duplicate
        env:
          OVSX_PAT: ${{ secrets.OVSX_PAT }}
      - name: Create the GitHub Release
        run: |
          if gh release view "$GITHUB_REF_NAME" > /dev/null 2>&1; then
            echo "GitHub Release $GITHUB_REF_NAME already exists; leaving it as it is."
          else
            gh release create "$GITHUB_REF_NAME" git-compare-plus.vsix \
              --verify-tag --title "Git Compare+ ${GITHUB_REF_NAME#v}" --notes-file release-notes.md
          fi
        env:
          GH_TOKEN: ${{ github.token }}
